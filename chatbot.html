<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriCare Chatbot</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- NutriCare CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ===============================
     CHATBOT
================================ -->

<!-- Floating Chat Button -->
<button
    id="chatButton"
    class="chat-button"
    aria-label="Open NutriCare chatbot"
    title="Chat with NutriCare"
>
    💬
</button>


<!-- Chat Window -->
<div
    id="chatWindow"
    class="chat-window"
    aria-label="NutriCare chatbot"
>

    <!-- ===============================
         CHAT HEADER
    ================================= -->

    <div class="chat-header">

        <div class="chat-header-info">

            <strong>NutriCare Assistant</strong>

            <small>
                Nutrition Support
            </small>

        </div>


        <!-- Close Button -->
        <button
            id="chatClose"
            class="chat-close"
            aria-label="Close chatbot"
            title="Close"
        >
            &times;
        </button>

    </div>


    <!-- ===============================
         CHAT BODY
    ================================= -->

    <div
        id="chatBody"
        class="chat-body"
    >

        <!-- Initial Bot Message -->
        <div class="bot-message">

            👋 Hi! I'm the NutriCare Assistant.

            <br>

            How can I help you with nutrition today?

        </div>

    </div>


    <!-- ===============================
         CHAT INPUT
    ================================= -->

    <div class="chat-input-area">

        <input
            type="text"
            id="chatInput"
            placeholder="Type your message..."
            autocomplete="off"
            aria-label="Chat message"
        >

        <button
            id="chatSend"
            aria-label="Send message"
            title="Send"
        >
            ➤
        </button>

    </div>

</div>


<!-- ===============================
     JAVASCRIPT
================================ -->

<script src="js/chatbot.js"></script>

</body>

</html>
