<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | NutriCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#d4f8d4,#f5fff7);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-card{
            width:100%;
            max-width:470px;
            background:#fff;
            border-radius:20px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.12);
        }

        .logo{
            font-size:42px;
            text-align:center;
            margin-bottom:10px;
        }

        h2{
            color:#198754;
            font-weight:700;
            text-align:center;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#777;
            margin-bottom:30px;
            font-size:15px;
        }

        .form-control{
            border-radius:12px;
            padding:12px;
        }

        .btn-success{
            border-radius:12px;
            padding:12px;
            font-weight:600;
        }

        #msg{
            text-align:center;
            margin-top:18px;
            font-weight:600;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="register-card">

    <div class="logo">🥗</div>

    <h2>NutriCare</h2>

    <p class="subtitle">
        Create your account to begin your healthy journey.
    </p>

    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input
            type="text"
            id="fullName"
            class="form-control"
            placeholder="Enter your full name">
    </div>

    <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Enter your email">
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter password">
    </div>

    <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm password">
    </div>

    <button
        id="registerBtn"
        class="btn btn-success w-100">

        Create Account

    </button>

    <p class="text-center mt-4">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </p>

    <p id="msg"></p>

</div>

<script type="module" src="js/register.js"></script>

</body>

</html>
